spring:
  application:
    name: factory-anomaly

  config:
    # 레포 루트의 .env를 읽는다 (backend/ 또는 루트 어디서 실행해도 동작하도록 두 경로 모두 지정)
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:factory_anomaly};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${MSSQL_SA_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway가 만들고, JPA는 엔티티와 일치하는지만 검사한다

  flyway:
    locations: classpath:db/migration

engine:
  # 실행할 엔진 목록. 여기 있는 엔진만 등록되고 측정값마다 순차 실행된다. 벤치마크는 비교할 엔진을 모두 나열한다 (D-019)
  #   예) 룰만: rule / 룰 + ML: rule, ml   (실행 시 --engine.active=rule,ml 로 바꿀 수 있다)
  active: rule
  # 알람·대시보드의 기준 엔진. active에 포함되어야 한다
  primary: rule
  rule:
    # alert.min-severity(50)와 함께 고장 조건만 알람이 되고, TWF 경고는 판정으로만 남는다 (D-004, D-021)
    failure-severity: 90 # HDF·PWF·OSF 조건 충족
    warning-severity: 40 # TWF 위험 구간(공구마모 200분 이상) 진입
  ml:
    base-url: http://localhost:8000
    connect-timeout: 300ms
    read-timeout: 1s
  jev:
    # 연동 구조만 준비됨. API 스펙·키 확보 전에는 active에 넣으면 시작이 실패한다 (D-018)
    api-key: ${JEV_API_KEY:}

alert:
  # 대표 엔진(engine.primary)의 판정이 anomaly이고 심각도가 이 값 이상이면 알람 (D-021)
  #   룰: 고장 조건(90)만 알람, TWF 경고(40)는 제외 / ML: 이상 판정이면 항상 95.4 이상이라 사실상 anomaly 기준
  min-severity: 50

dashboard:
  # http://localhost:8080/dashboard (D-022). 시간은 UTC로 저장하고 화면에서만 이 시간대로 보여준다
  time-zone: Asia/Seoul
  refresh: 3s
  recent-rows: 20 # 엔진별 판정 표에 보여줄 최근 측정값 수
  summary-window: 500 # 엔진별 요약(이상·실패 건수, 응답시간 p50/p95)을 계산할 최근 측정값 수
